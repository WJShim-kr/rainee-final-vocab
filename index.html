<style>

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.btn{border:0;border-radius:12px;padding:11px;font-weight:700}.bad{background:#fff0e3;color:var(--warn)}.good{background:#e9f7ef;color:var(--ok)}.secondary{background:#eef1f6;color:#3e4655}.primary{background:#1d3f78;color:#fff}.smallrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.smallrow .btn{font-size:12px;padding:8px 10px}

<div class="wrap">
<section class="hero">
<h1>📚 기말고사 영어 단어장</h1>
<p>교과서 3·4·5과 · 수특 1~7 · 6월 학평 29·30·31·32·35·36·38 · 기본어 보충<br>수특 8번은 제외했어요.</p>
<div class="stats"><div class="stat"><b id="total">0</b><span>현재 범위</span></div><div class="stat"><b id="known">0</b><span>알아요</span></div><div class="stat"><b id="again">0</b><span>다시 볼 것</span></div></div>
</section>

<section class="panel">
<div class="controls">
<select id="scope"></select>
<select id="level"><option value="all">핵심+기본 전체</option><option value="core">시험 핵심어</option><option value="basic">기본어 보충</option><option value="again">다시 볼 단어</option></select>
<input id="search" placeholder="영어/뜻 검색">
</div>
<p class="note">🟦 시험 핵심어 = 확인된 시험범위에서 선별 · 🟧 기본어 = 기본어 공백을 메우기 위한 보충</p>
</section>

<section id="study" class="panel">
<div class="tabs"><button class="tab active" data-mode="all">전체</button><button class="tab" data-mode="daily">오늘의 20개</button><button class="tab" data-mode="again">다시 보기</button><button id="shuffle" class="tab">섞기</button></div>
<div id="card" class="card" tabindex="0">
<div class="badges"><span id="scopeBadge" class="badge"></span><span id="levelBadge" class="badge"></span></div>
<div id="word" class="word"></div>
<div id="answer" class="hidden"><div id="meaning" class="meaning"></div><div id="example" class="example"></div></div>
<div id="hint" class="tap">카드를 눌러 뜻 보기</div>
</div>
<div class="actions"><button id="againBtn" class="btn bad">↻ 다시</button><button id="knownBtn" class="btn good">✓ 알아요</button></div>
<div class="smallrow"><button id="prev" class="btn secondary">← 이전</button><button id="next" class="btn secondary">다음 →</button><button id="reset" class="btn secondary">표시 초기화</button></div>
</section>

<section id="quiz" class="panel hidden">
<div style="display:flex;justify-content:space-between;align-items:center"><b>🎯 4지선다 퀴즈</b><span id="score" class="badge">0 / 0</span></div>
<div id="quizQ" class="quizq"></div><div id="opts" class="options"></div><button id="nextQuiz" class="btn primary hidden" style="width:100%;margin-top:9px">다음 문제</button>
</section>

<section id="listview" class="panel hidden">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px"><b>🗂 전체 목록</b><span id="count" class="badge"></span></div><div id="list" class="list"></div>
</section>
</div>

<div class="footer"><div class="inner">
<button class="nav active" data-view="study">🃏<br>암기</button><button class="nav" data-view="quiz">🎯<br>퀴즈</button><button class="nav" data-view="listview">🗂<br>목록</button><button class="nav" id="dailyNav">✨<br>오늘20</button>
</div></div>
